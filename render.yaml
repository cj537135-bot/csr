services:
  - type: web
    name: sahara
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /var/data/sahara.db
    disk:
      name: sahara-data
      mountPath: /var/data
      sizeGB: 1
